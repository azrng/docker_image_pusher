name: Docker

on:
  workflow_dispatch:
    inputs:
      smart_sync:
        description: '启用智能同步（跳过已存在的镜像）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main ]
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yaml'
      - 'scripts/sync-images.sh'


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  SMART_SYNC: "${{ github.event.inputs.smart_sync || 'true' }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:

        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        chmod +x ./scripts/sync-images.sh
        ./scripts/sync-images.sh "$ALIYUN_REGISTRY" "$ALIYUN_NAME_SPACE" "$ALIYUN_REGISTRY_USER" "$ALIYUN_REGISTRY_PASSWORD"

    - name: Generate Summary
      if: always()
      run: |
        echo "## 📊 Docker 镜像同步报告" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 执行信息" >> $GITHUB_STEP_SUMMARY
        echo "- **仓库**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **执行时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # 输出统计信息（从脚本输出中提取）
        if [ -f failed-images.txt ] && [ -s failed-images.txt ]; then
          failed_count=$(wc -l < failed-images.txt)
          echo "### ⚠️ 失败镜像列表" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat failed-images.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        echo "### 💡 使用提示" >> $GITHUB_STEP_SUMMARY
        echo "如需拉取镜像，使用以下命令：" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "docker pull $ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/[镜像名]:[版本号]" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
