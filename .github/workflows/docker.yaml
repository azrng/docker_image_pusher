name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:

        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY

        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            # 解析新格式：origin_name [platform]
            # 1 个字段：原始名字
            # 2 个字段：原始名字 平台
            field_count=$(echo "$line" | awk '{print NF}')

            if [ "$field_count" -eq 1 ]; then
                origin_image=$(echo "$line" | awk '{print $1}')
                platform=""
            else
                origin_image=$(echo "$line" | awk '{print $1}')
                platform=$(echo "$line" | awk '{print $2}')
            fi

            echo "origin_image: $origin_image"
            echo "platform: $platform"

            # 构建 docker pull 命令
            if [ -z "$platform" ]; then
                pull_cmd="docker pull $origin_image"
            else
                pull_cmd="docker pull --platform $platform $origin_image"
            fi

            echo "$pull_cmd"
            $pull_cmd

            # 生成新名字规则：
            # 1. 去掉 / 符号，例如 dotnet/aspnet -> dotnetaspnet
            # 2. 如果是 arm64 架构，添加 -arm64 后缀
            # 3. 如果是 x86 架构（默认），不加后缀

            # 获取镜像名：版本号（例如 nginx:1.25.3 或 dotnet/aspnet:6.0）
            image_name_tag=$(echo "$origin_image" | awk -F'/' '{print $NF}')
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"

            # 生成基础名字：去掉 / 符号
            # 例如：dotnet/aspnet:6.0 -> dotnetaspnet:6.0
            base_name=$(echo "$image_name_tag" | tr -d '/')

            # 根据平台添加后缀
            if [ -z "$platform" ] || [ "$platform" = "linux/amd64" ]; then
                # x86 架构，不加后缀
                new_name="$base_name"
            else
                # 其他架构，提取架构简称添加后缀
                # linux/arm64 -> arm64
                # linux/amd64 -> amd64 (但上面已经处理了)
                # linux/arm/v7 -> armv7
                arch_suffix=$(echo "$platform" | sed 's/linux\///' | tr '/' '')
                new_name="${base_name}-${arch_suffix}"
            fi

            echo "new_name: $new_name"

            # 构建新的镜像地址
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$new_name"

            echo "docker tag $origin_image $new_image"
            docker tag $origin_image $new_image

            echo "docker push $new_image"
            docker push $new_image

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi $origin_image
            docker rmi $new_image
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="

        done < images.txt
